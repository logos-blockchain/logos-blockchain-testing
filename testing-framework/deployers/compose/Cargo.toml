[package]
categories.workspace  = true
description.workspace = true
edition.workspace     = true
keywords.workspace    = true
license.workspace     = true
name                  = "testing-framework-runner-compose"
readme.workspace      = true
repository.workspace  = true
version               = "0.1.0"

[lints]
workspace = true

[dependencies]
anyhow                      = "1"
async-trait                 = { workspace = true }
futures                     = { default-features = false, features = ["std"], version = "0.3" }
reqwest                     = { features = ["json"], workspace = true }
serde                       = { features = ["derive"], workspace = true }
serde_json                  = { workspace = true }
tempfile                    = { workspace = true }
tera                        = "1.19"
testing-framework-container = { path = "../../container" }
testing-framework-core      = { path = "../../core" }
thiserror                   = { workspace = true }
tokio                       = { features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"], workspace = true }
tokio-retry                 = "0.3"
tracing                     = { workspace = true }
url                         = { version = "2" }
uuid                        = { features = ["v4"], version = "1" }

[dev-dependencies]
serde_json = { workspace = true }
