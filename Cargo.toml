[workspace]
members = [
  "cfgsync/adapter",
  "cfgsync/artifacts",
  "cfgsync/core",
  "cfgsync/runtime",
  "examples/kvstore/examples",
  "examples/kvstore/kvstore-node",
  "examples/kvstore/testing/integration",
  "examples/kvstore/testing/workloads",
  "examples/metrics_counter/examples",
  "examples/metrics_counter/metrics-counter-node",
  "examples/metrics_counter/testing/integration",
  "examples/metrics_counter/testing/workloads",
  "examples/multi_app/e2e",
  "examples/multi_app/fixture",
  "examples/multi_app/job-worker",
  "examples/nats/examples",
  "examples/nats/testing/integration",
  "examples/nats/testing/workloads",
  "examples/openraft_kv/examples",
  "examples/openraft_kv/openraft-kv-node",
  "examples/openraft_kv/testing/integration",
  "examples/openraft_kv/testing/workloads",
  "examples/pubsub/examples",
  "examples/pubsub/pubsub-node",
  "examples/pubsub/testing/integration",
  "examples/pubsub/testing/workloads",
  "examples/queue/examples",
  "examples/queue/queue-node",
  "examples/queue/testing/integration",
  "examples/queue/testing/workloads",
  "examples/redis_streams/examples",
  "examples/redis_streams/testing/integration",
  "examples/redis_streams/testing/workloads",
  "testing-framework/app",
  "testing-framework/container",
  "testing-framework/core",
  "testing-framework/deployers/compose",
  "testing-framework/deployers/k8s",
  "testing-framework/deployers/local",
]
resolver = "2"

[workspace.package]
categories  = []
description = "Logos testing framework workspace (split out from logos-blockchain-node)"
edition     = "2024"
keywords    = ["framework", "nomos", "testing"]
license     = "MIT OR Apache-2.0"
readme      = "README.md"
repository  = "https://example.invalid/nomos-testing-local"
version     = "0.1.0"

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
all = "allow"

[workspace.dependencies]
# Local testing framework crates
cfgsync-adapter                  = { default-features = false, path = "cfgsync/adapter" }
cfgsync-artifacts                = { default-features = false, path = "cfgsync/artifacts" }
cfgsync-core                     = { default-features = false, path = "cfgsync/core" }
testing-framework-app            = { default-features = false, path = "testing-framework/app" }
testing-framework-container      = { default-features = false, path = "testing-framework/container" }
testing-framework-core           = { default-features = false, path = "testing-framework/core" }
testing-framework-runner-compose = { default-features = false, path = "testing-framework/deployers/compose" }
testing-framework-runner-k8s     = { default-features = false, path = "testing-framework/deployers/k8s" }
testing-framework-runner-local   = { default-features = false, path = "testing-framework/deployers/local" }
# External crates
async-trait         = { default-features = false, version = "0.1" }
bytes               = { default-features = false, version = "1.3" }
hex                 = { default-features = false, version = "0.4.3" }
libp2p              = { default-features = false, version = "0.55" }
num-bigint          = { default-features = false, version = "0.4" }
openraft            = { default-features = true, features = ["serde", "type-alias"], version = "0.10.0-alpha.17" }
openraft-memstore   = { default-features = true, version = "0.10.0-alpha.17" }
parking_lot         = { default-features = false, version = "0.12" }
rand                = { default-features = false, features = ["std", "std_rng"], version = "0.8" }
reqwest             = { default-features = false, version = "0.12" }
serde               = { default-features = true, features = ["derive"], version = "1.0" }
serde_json          = { default-features = false, version = "1.0" }
serde_path_to_error = { default-features = false, version = "0.1" }
serde_with          = { default-features = false, version = "3.14.0" }
serde_yaml          = { default-features = false, version = "0.9.33" }
tempfile            = { default-features = false, version = "3" }
thiserror           = { default-features = false, version = "2.0" }
time                = { default-features = false, version = "0.3" }
tokio               = { default-features = false, version = "1" }
tracing             = { default-features = false, version = "0.1" }
uuid                = { default-features = false, version = "1", features = ["v4"] }
